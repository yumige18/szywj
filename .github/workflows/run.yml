name: 运行定时脚本

on:
  schedule:
    - cron: '0 0 * * *' 
  workflow_dispatch: 

jobs:
  run-my-script:
    # 修复 1：将 ubuntu-latest 改为 ubuntu-22.04 以兼容 Python 3.9.7
    runs-on: ubuntu-22.04 

    steps:
      - name: 检出代码
        # 修复 2：升级到 v4
        uses: actions/checkout@v4 

      - name: 设置 Python 3.9.7
        # 修复 2：升级到 v5
        uses: actions/setup-python@v5 
        with:
          python-version: '3.9.7' 

      - name: 安装依赖
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 运行 Python 脚本
        run: python sms.py
