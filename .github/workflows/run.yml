name: 运行定时脚本

# 触发条件
on:
  schedule:
    # 这里的 cron 表达式决定了运行时间 (分 时 日 月 星期)
    # 注意：这里使用的是 UTC 时间！如果想在北京时间每天早上 8 点运行，UTC 时间就是 0 点
    - cron: '0 0 * * *' 
  workflow_dispatch: # 这个配置允许你在网页上手动点击按钮运行，方便测试

jobs:
  run-my-script:
    runs-on: ubuntu-latest # 使用最新的 Linux 免费服务器

    steps:
      # 1. 把仓库里的代码拉取到服务器上
      - name: 检出代码
        uses: actions/checkout@v3

      # 2. 安装并配置 Python 3.9.7 
      - name: 设置 Python 3.9.7
        uses: actions/setup-python@v4
        with:
          python-version: '3.9.7' # 精准锁定版本

      # 3. 安装依赖包 (如果你没有 requirements.txt，可以删掉这一步)
      - name: 安装依赖
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. 运行你的脚本
      - name: 运行 Python 脚本
        run: python sms.py
