name: 运行短信脚本

# 保持设置北京时间（全局生效），让 Python 脚本内部获取的时间为中国时间
env:
  TZ: Asia/Shanghai

on:
  schedule:
    # 北京时间 00:00 -> UTC 16:00
    # 北京时间 06:00 -> UTC 22:00
    # 北京时间 12:00 -> UTC 04:00
    # 北京时间 18:00 -> UTC 10:00
    # 合并后的 cron 表达式：每天的 UTC 4点,10点,16点,22点执行
    - cron: '0 4,10,16,22 * * *' 
  workflow_dispatch: 

jobs:
  run-my-script:
    runs-on: ubuntu-22.04 

    steps:
      - name: 检出代码
        uses: actions/checkout@v4 

      - name: 设置 Python 3.9
        uses: actions/setup-python@v5 
        with:
          # 只写 3.9，让系统自动匹配 3.9 系列最新版
          python-version: '3.9' 
          # 开启依赖缓存，避免每次都重新下载，提升运行速度
          cache: 'pip'

      - name: 安装依赖
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 运行 Python 脚本（带自动输入）
        run: |
          # 模拟人工输入：先输入2回车，再输入17879807573回车
          printf "2\n17879807573\n" | python sms.py
