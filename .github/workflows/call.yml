name: 运行呼叫脚本

# 设置全局环境变量：北京时间
env:
  TZ: Asia/Shanghai

on:
  # 只保留手动/Webhook触发，并要求传入号码
  workflow_dispatch:
    inputs:
      phone_number:
        description: '请输入呼叫的目标号码'
        required: true
        default: '17879807573'

jobs:
  run-call-script:
    runs-on: ubuntu-22.04 

    steps:
      - name: 记录开始时间
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: 检出代码
        uses: actions/checkout@v4 

      - name: 设置 Python 3.9
        uses: actions/setup-python@v5 
        with:
          python-version: '3.9' 
          cache: 'pip'

      - name: 安装依赖
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 运行 call.py 脚本
        id: run_script
        run: |
          TARGET_NUMBER="${{ github.event.inputs.phone_number }}"
          echo "接收到 Cloudflare / 手动传入的号码: $TARGET_NUMBER"
          
          # 将传入的号码交互输入给 Python 脚本
          printf "%s\n" "$TARGET_NUMBER" | python call.py
          
          # 标记运行成功，传递给下一步
          echo "did_run=true" >> $GITHUB_OUTPUT

      - name: 计算任务耗时
        if: always()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          MINS=$((DURATION / 60))
          SECS=$((DURATION % 60))
          echo "TASK_DURATION=${MINS}分${SECS}秒" >> $GITHUB_ENV

      - name: 发送 Telegram 通知
        uses: appleboy/telegram-action@master
        # 只要走到这一步就发送通知，并显示动态号码
        if: always() && steps.run_script.outputs.did_run == 'true'
        with:
          to: ${{ secrets.TG_CHAT_ID }}
          token: ${{ secrets.TG_BOT_TOKEN }}
          message: |
            🔔 【呼叫脚本运行汇报】
            运行状态: ${{ job.status }}
            任务耗时: ${{ env.TASK_DURATION }}
            触发方式: Cloudflare Webhook / 手动执行
            目标号码: ${{ github.event.inputs.phone_number }}
