name: 运行呼叫脚本

# 设置全局环境变量：北京时间
env:
  TZ: Asia/Shanghai

on:
  schedule:
    # 每天在 UTC 时间 0点（北京时间 8:00）运行
    - cron: '0 0 * * *' 
  workflow_dispatch: 

jobs:
  run-call-script:
    runs-on: ubuntu-22.04 

    steps:
      - name: 检出代码
        uses: actions/checkout@v4 

      - name: 查看当前系统时间和时区
        run: |
          echo "当前的系统时间是："
          date
          echo "当前的时区配置是："
          cat /etc/timezone

      - name: 设置 Python 3.9
        uses: actions/setup-python@v5 
        with:
          python-version: '3.9' 
          cache: 'pip'

      - name: 安装依赖
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 运行 call.py 脚本（带自动输入）
        run: |
          # 模拟人工输入：输入手机号 17879807573 并回车
          printf "15798162642\n" | python call.py
