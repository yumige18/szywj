name: 运行呼叫脚本

# 设置全局环境变量：北京时间
env:
  TZ: Asia/Shanghai

on:
  schedule:
    # 中国时间 07:40 -> UTC 23:40 (前一天)
    - cron: '40 23 * * *'
    # 中国时间 13:30 -> UTC 05:30
    - cron: '30 5 * * *'
    # 中国时间 19:00 -> UTC 11:00
    - cron: '0 11 * * *'
    # 中国时间 23:00 -> UTC 15:00
    - cron: '0 15 * * *'
  workflow_dispatch: 

jobs:
  run-call-script:
    runs-on: ubuntu-22.04 

    steps:
      - name: 检出代码
        uses: actions/checkout@v4 

      - name: 设置 Python 3.9
        uses: actions/setup-python@v5 
        with:
          python-version: '3.9' 
          cache: 'pip'

      - name: 安装依赖
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 运行 call.py 脚本（带自动输入）
        run: |
          # 模拟人工输入：输入手机号 17879807573 并回车
          printf "17879807573\n" | python call.py
