name: 运行短信脚本

# 保持设置北京时间（全局生效），让 Python 脚本内部获取的时间为中国时间
env:
  TZ: Asia/Shanghai

on:
  schedule:
    # 北京时间 12:40 -> UTC 04:40
    # 每天的中午 12:40 执行
    - cron: '40 4 * * *' 
  workflow_dispatch: 

jobs:
  run-my-script:
    runs-on: ubuntu-22.04 

    steps:
      - name: 检出代码
        uses: actions/checkout@v4 

      - name: 设置 Python 3.9
        uses: actions/setup-python@v5 
        with:
          # 只写 3.9，让系统自动匹配 3.9 系列最新版
          python-version: '3.9' 
          # 开启依赖缓存，避免每次都重新下载，提升运行速度
          cache: 'pip'

      - name: 安装依赖
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 运行 Python 脚本（带自动输入）
        run: |
          # 模拟人工输入：先输入2回车，再输入17879807573回车
          printf "2\n15798162642\n" | python sms.py

      # 👇 新增的 Telegram 通知步骤
      - name: 发送 Telegram 通知
        uses: appleboy/telegram-action@master
        if: always()  # 无论上面的脚本成功还是失败，都会发消息
        with:
          to: ${{ secrets.TG_CHAT_ID }}
          token: ${{ secrets.TG_BOT_TOKEN }}
          message: |
            🔔 【短信脚本运行汇报】
            运行状态: ${{ job.status }}
            触发方式: 定时任务执行完毕
            目标号码: 17879807573
